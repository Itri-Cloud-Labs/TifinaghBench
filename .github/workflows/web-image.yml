name: Website image

# Builds the website's Docker image on Blacksmith and pushes it to GHCR.
# Pull requests build the image without pushing it.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'web/**'
      - 'results/**'
      - '.dockerignore'
      - '.gitignore'
      - '.github/workflows/web-image.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'results/**'
      - '.dockerignore'
      - '.gitignore'
      - '.github/workflows/web-image.yml'
  workflow_dispatch:

concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      # GHCR image names must be lowercase.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-web" >> "$GITHUB_OUTPUT"

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=ref,event=pr

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: tifinaghbench/web-image

      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Redeploy on Coolify
        if: github.event_name != 'pull_request'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 \
            --request POST \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json" \
            --data '{"uuid":"ntoqi04kh89kj547q2c4cw4r","force":false}' \
            --write-out '\nHTTP %{http_code}\n' \
            "https://coolify.itri.cloud/api/v1/deploy"
